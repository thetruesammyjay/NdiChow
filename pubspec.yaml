name: ndichow
description: "NdiChow food ordering mobile application."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_dotenv: ^6.0.0
  http: ^1.6.0
  intl: ^0.20.2
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/ndichow-app-icon.png
  fonts:
    - family: PPNeueMachina
      fonts:
        - asset: assets/fonts/PPNeueMachina/PPNeueMachina-Light.otf
          weight: 300
        - asset: assets/fonts/PPNeueMachina/PPNeueMachina-Regular.otf
          weight: 400
        - asset: assets/fonts/PPNeueMachina/PPNeueMachina-Ultrabold.otf
          weight: 800
