name: ndichow
description: "NdiChow food ordering mobile application."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  intl: ^0.20.2
  flutter_svg: ^2.2.0
  lottie: ^3.3.1
  provider: ^6.1.5+1
  rive: ^0.13.20
  flutter_secure_storage: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/ndichow-app-icon.png
    - assets/icons/basil/
    - assets/animations/
    - assets/animations/lottie/
  fonts:
    - family: PPNeueMachina
      fonts:
        - asset: assets/fonts/PPNeueMachina/PPNeueMachina-Light.otf
          weight: 300
        - asset: assets/fonts/PPNeueMachina/PPNeueMachina-Regular.otf
          weight: 400
        - asset: assets/fonts/PPNeueMachina/PPNeueMachina-Ultrabold.otf
          weight: 800
